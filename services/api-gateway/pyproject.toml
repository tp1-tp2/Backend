[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "api-gateway"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.hypothesis]
max_examples = 100
deadline = 5000

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
