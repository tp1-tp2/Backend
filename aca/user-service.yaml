location: Canada Central
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/cfcab251-b0bf-45d7-8a11-b78b26aa6992/resourceGroups/rg-asr-quechua/providers/Microsoft.App/managedEnvironments/aca-asr-quechua
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: Auto
  template:
    containers:
      - name: user-service
        image: ghcr.io/zrodrigochirinos/user-service:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            value: postgresql+asyncpg://pgadmin:CHANGE_ME@pg-asr-quechua.postgres.database.azure.com/user_db?ssl=require
          - name: AUTH_SERVICE_URL
            value: http://auth-service
          - name: EMAIL_CONFIRMATION_TIMEOUT_SECONDS
            value: "30"
          - name: EMAIL_CHANGE_EXPIRY_HOURS
            value: "24"
          - name: MIN_AGE_YEARS
            value: "13"
          - name: SMTP_HOST
            value: smtp.gmail.com
          - name: SMTP_PORT
            value: "587"
          - name: SMTP_USER
            value: CHANGE_ME
          - name: SMTP_PASSWORD
            value: CHANGE_ME
          - name: SMTP_FROM
            value: CHANGE_ME
          - name: FRONTEND_URL
            value: https://asr-quechua-frontend-b722a.web.app
    scale:
      minReplicas: 1
      maxReplicas: 1
