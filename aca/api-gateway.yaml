location: Canada Central
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/cfcab251-b0bf-45d7-8a11-b78b26aa6992/resourceGroups/rg-asr-quechua/providers/Microsoft.App/managedEnvironments/aca-asr-quechua
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      transport: Auto
  template:
    containers:
      - name: api-gateway
        image: ghcr.io/zrodrigochirinos/api-gateway:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: SERVICE_NAME
            value: api-gateway
          - name: AUTH_SERVICE_URL
            value: http://auth-service
          - name: USER_SERVICE_URL
            value: http://user-service
          - name: AUDIO_PROCESSOR_URL
            value: http://audio-processor
          - name: ASR_SERVICE_URL
            value: http://asr-service
          - name: TRANSCRIPTION_MANAGER_URL
            value: http://transcription-manager
    scale:
      minReplicas: 1
      maxReplicas: 1
