location: Canada Central
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/cfcab251-b0bf-45d7-8a11-b78b26aa6992/resourceGroups/rg-asr-quechua/providers/Microsoft.App/managedEnvironments/aca-asr-quechua
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: Auto
  template:
    containers:
      - name: asr-service
        image: ghcr.io/zrodrigochirinos/asr-service:latest
        resources:
          cpu: 2.0
          memory: 4Gi
        env:
          - name: MODEL_ID
            value: QuechuaBase/whisper-base-qxp-finetuned
          - name: DEVICE
            value: cpu
          - name: ADAPTIVE_MODE
            value: "true"
          - name: AUTH_SERVICE_URL
            value: http://auth-service
          - name: TRANSCRIPTION_MANAGER_URL
            value: http://transcription-manager
          - name: MAX_CONCURRENT_CONNECTIONS
            value: "100"
          - name: STREAMING_PARTIAL_INTERVAL_SECONDS
            value: "3"
          - name: AUDIO_BUFFER_MAX_SECONDS
            value: "600"
          - name: PARTIAL_WINDOW_SECONDS
            value: "10"
          - name: SERVICE_NAME
            value: asr-service
    # Horizontal autoscaling, complementing device_manager.py's vertical
    # (in-process) adaptation — see docs/06-horizontal-autoscaling.md.
    # Trigger is HTTP concurrency, not CPU%, because asr-service runs
    # --workers 1 (module-global Whisper model) and each real transcription
    # holds that single worker for 1-3s+ — 2 concurrent requests per replica
    # is already a queue, not a CPU spike, so CPU-based scaling would react
    # too late.
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "2"
