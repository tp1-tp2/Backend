location: Canada Central
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/cfcab251-b0bf-45d7-8a11-b78b26aa6992/resourceGroups/rg-asr-quechua/providers/Microsoft.App/managedEnvironments/aca-asr-quechua
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: Auto
  template:
    containers:
      - name: auth-service
        image: ghcr.io/zrodrigochirinos/auth-service:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            value: postgresql+asyncpg://pgadmin:CHANGE_ME@pg-asr-quechua.postgres.database.azure.com/auth_db?ssl=require
          - name: JWT_SECRET_KEY
            value: CHANGE_ME
          - name: JWT_ALGORITHM
            value: HS256
          - name: JWT_EXPIRATION_HOURS
            value: "24"
          - name: BCRYPT_ROUNDS
            value: "12"
          - name: RATE_LIMIT_ATTEMPTS
            value: "5"
          - name: RATE_LIMIT_WINDOW_MINUTES
            value: "15"
          - name: RECOVERY_TOKEN_LENGTH
            value: "32"
          - name: RECOVERY_TOKEN_EXPIRY_HOURS
            value: "1"
          - name: SMTP_HOST
            value: smtp.gmail.com
          - name: SMTP_PORT
            value: "587"
          - name: SMTP_USER
            value: CHANGE_ME
          - name: SMTP_PASSWORD
            value: CHANGE_ME
          - name: SMTP_FROM
            value: CHANGE_ME
          - name: FRONTEND_URL
            value: https://asr-quechua-frontend-b722a.web.app
    scale:
      minReplicas: 1
      maxReplicas: 1
