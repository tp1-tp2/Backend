location: Canada Central
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/cfcab251-b0bf-45d7-8a11-b78b26aa6992/resourceGroups/rg-asr-quechua/providers/Microsoft.App/managedEnvironments/aca-asr-quechua
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: Auto
  template:
    containers:
      - name: audio-processor
        image: ghcr.io/zrodrigochirinos/audio-processor:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            value: postgresql+asyncpg://pgadmin:CHANGE_ME@pg-asr-quechua.postgres.database.azure.com/audio_db?ssl=require
          - name: ASR_SERVICE_URL
            value: http://asr-service
          - name: SERVICE_NAME
            value: audio-processor
    scale:
      minReplicas: 1
      maxReplicas: 1
