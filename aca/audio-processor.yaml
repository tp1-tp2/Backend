location: Canada Central
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/cfcab251-b0bf-45d7-8a11-b78b26aa6992/resourceGroups/rg-asr-quechua/providers/Microsoft.App/managedEnvironments/aca-asr-quechua
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: Auto
  template:
    containers:
      - name: audio-processor
        image: ghcr.io/zrodrigochirinos/audio-processor:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            value: postgresql+asyncpg://pgadmin:CHANGE_ME@pg-asr-quechua.postgres.database.azure.com/audio_db?ssl=require
          - name: ASR_SERVICE_URL
            value: http://asr-service
          - name: SERVICE_NAME
            value: audio-processor
    # Horizontal autoscaling — audio-processor is in the critical path of
    # every /transcribe request (ffmpeg conversion before forwarding to
    # asr-service) and was fixed at 1 replica when E4 found auth-service as
    # the load-test bottleneck; extended here on the same reasoning. Runs
    # --workers 4 like auth-service (no module-global-model constraint), so
    # same threshold. See docs/06-horizontal-autoscaling.md.
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "10"
