apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-processor
  namespace: asr-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audio-processor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: audio-processor
    spec:
      containers:
        - name: audio-processor
          image: asr-platform/audio-processor:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: audio-processor-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: audio-processor-secret
                  key: database_url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
