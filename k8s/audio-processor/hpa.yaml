apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audio-processor-hpa
  namespace: asr-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audio-processor
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
