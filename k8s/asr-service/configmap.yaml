apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-service-config
  namespace: asr-platform
data:
  SERVICE_NAME: "asr-service"
  WHISPER_MODEL: "medium"
  WHISPER_LANGUAGE: "qu"
  DEVICE: "cpu"
  TRANSCRIPTION_MANAGER_URL: "http://transcription-manager:8000"
  MAX_CONCURRENT_CONNECTIONS: "100"
  STREAMING_PARTIAL_INTERVAL_SECONDS: "3"
  AUDIO_BUFFER_MAX_SECONDS: "30"
