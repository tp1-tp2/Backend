apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-service
  namespace: asr-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asr-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: asr-service
    spec:
      containers:
        - name: asr-service
          image: asr-platform/asr-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: asr-service-config
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          volumeMounts:
            - name: whisper-cache
              mountPath: /root/.cache/whisper
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: whisper-cache
          persistentVolumeClaim:
            claimName: whisper-model-pvc
