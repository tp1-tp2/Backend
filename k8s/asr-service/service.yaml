apiVersion: v1
kind: Service
metadata:
  name: asr-service
  namespace: asr-platform
spec:
  type: ClusterIP
  selector:
    app: asr-service
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: ws
      protocol: TCP
      port: 8001
      targetPort: 8001
