apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcription-manager
  namespace: asr-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transcription-manager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: transcription-manager
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [transcription-manager]
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: transcription-manager
          image: asr-platform/transcription-manager:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: transcription-manager-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: transcription-manager-secret
                  key: database_url
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
