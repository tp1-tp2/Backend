apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: asr-platform
data:
  SERVICE_NAME: "auth-service"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  BCRYPT_ROUNDS: "12"
  RATE_LIMIT_ATTEMPTS: "5"
  RATE_LIMIT_WINDOW_MINUTES: "15"
  RECOVERY_TOKEN_LENGTH: "32"
  RECOVERY_TOKEN_EXPIRY_HOURS: "1"
