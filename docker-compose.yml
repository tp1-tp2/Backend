services:

  # ── API GATEWAY ─────────────────────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - SERVICE_NAME=api-gateway
      - AUTH_SERVICE_URL=http://auth-service:8000
      - USER_SERVICE_URL=http://user-service:8000
      - AUDIO_PROCESSOR_URL=http://audio-processor:8000
      - ASR_SERVICE_URL=http://asr-service:8000
      - TRANSCRIPTION_MANAGER_URL=http://transcription-manager:8000
      # v2: validate JWTs locally (auth-service off the critical path). Set
      # AUTH_MODE=remote to reproduce the v1 behaviour for ablation runs.
      - AUTH_MODE=${AUTH_MODE:-local}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_in_production}
      - REDIS_URL=redis://redis:6379/0
      - REVOCATION_FAIL_OPEN=${REVOCATION_FAIL_OPEN:-true}
      - TRANSCRIBE_TIMEOUT=${GATEWAY_TRANSCRIBE_TIMEOUT:-120}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      audio-processor:
        condition: service_healthy
      transcription-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── AUTH SERVICE ─────────────────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8000"
    environment:
      - SERVICE_NAME=auth-service
      - DATABASE_URL=postgresql+asyncpg://auth_user:auth_pass@auth-db:5432/auth_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_in_production}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@asr-quechua.com}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── USER SERVICE ─────────────────────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    ports:
      - "8002:8000"
    environment:
      - SERVICE_NAME=user-service
      - DATABASE_URL=postgresql+asyncpg://user_user:user_pass@user-db:5432/user_db
      - AUTH_SERVICE_URL=http://auth-service:8000
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@asr-quechua.com}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      user-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── AUDIO PROCESSOR ──────────────────────────────────────────────────────────
  audio-processor:
    build: ./services/audio-processor
    ports:
      - "8003:8000"
    environment:
      - SERVICE_NAME=audio-processor
      - DATABASE_URL=postgresql+asyncpg://audio_user:audio_pass@audio-db:5432/audio_db
      - ASR_SERVICE_URL=http://asr-service:8000
      - STORAGE_URL=${STORAGE_URL:-local}
      - REDIS_URL=redis://redis:6379/0
      - ASR_TIMEOUT_SECONDS=${ASR_TIMEOUT_SECONDS:-110}
    volumes:
      - asr_audio:/tmp/asr_audio
    depends_on:
      audio-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── ASR SERVICE ──────────────────────────────────────────────────────────────
  # Nota: el primer build descarga whisper-medium (~1.5 GB).
  # start_period largo permite que el modelo cargue antes del primer healthcheck.
  asr-service:
    build: ./services/asr-service
    ports:
      - "8004:8000"
    environment:
      - SERVICE_NAME=asr-service
      - MODEL_ID=QuechuaBase/whisper-base-qxp-finetuned
      - HF_HUB_DISABLE_IMPLICIT_TOKEN=1
      - AUTH_SERVICE_URL=http://auth-service:8000
      - TRANSCRIPTION_MANAGER_URL=http://transcription-manager:8000
      - DEVICE=${DEVICE:-cpu}
      # Inference engine and parallel lanes (docs/14-optimizacion-cpu.md)
      - ENGINE=${ENGINE:-transformers}
      - INFERENCE_LANES=${INFERENCE_LANES:-1}
      - CT2_CPU_THREADS=${CT2_CPU_THREADS:-0}
      - ADAPTIVE_MODE=${ADAPTIVE_MODE:-true}
      - FORCE_DEVICE=${FORCE_DEVICE:-}
      - FORCE_COMPUTE_TYPE=${FORCE_COMPUTE_TYPE:-}
      - FORCE_BATCH_SIZE=${FORCE_BATCH_SIZE:-}
      - BATCH_SIZE_GPU=${BATCH_SIZE_GPU:-8}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-16}
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-64}
      - ADMISSION_MAX_WAIT_SECONDS=${ADMISSION_MAX_WAIT_SECONDS:-60}
      - INFERENCE_TIMEOUT_SECONDS=${INFERENCE_TIMEOUT_SECONDS:-100}
      - AUTH_MODE=${AUTH_MODE:-local}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_in_production}
      - REDIS_URL=redis://redis:6379/0
      - JOB_WORKER_ENABLED=${JOB_WORKER_ENABLED:-true}
    volumes:
      - asr_audio:/tmp/asr_audio
    mem_limit: 4g
    memswap_limit: 4g
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── TRANSCRIPTION MANAGER ────────────────────────────────────────────────────
  transcription-manager:
    build: ./services/transcription-manager
    ports:
      - "8005:8000"
    environment:
      - SERVICE_NAME=transcription-manager
      - DATABASE_URL=postgresql+asyncpg://trans_user:trans_pass@trans-db:5432/trans_db
    depends_on:
      trans-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── MONOLITH BASELINE (E3 experimental control) ────────────────────────────
  # Single process/container: auth + audio validation + ASR + persistence,
  # fixed device, no separation of concerns, no runtime adaptation. Run twice
  # (DEVICE=cpu and DEVICE=cuda, rebuild between runs) for symmetric baselines
  # against asr-service's adaptive runs. See docs/02-monolith-baseline.md.
  monolith-baseline:
    build: ./services/monolith-baseline
    ports:
      - "8006:8000"
    environment:
      - SERVICE_NAME=monolith-baseline
      - DATABASE_URL=postgresql+asyncpg://monolith_user:monolith_pass@monolith-db:5432/monolith_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_in_production}
      - MODEL_ID=QuechuaBase/whisper-base-qxp-finetuned
      - DEVICE=${MONOLITH_DEVICE:-cpu}
      - ENGINE=${MONOLITH_ENGINE:-transformers}
      - COMPUTE_TYPE=${MONOLITH_COMPUTE_TYPE:-fp32}
      - INFERENCE_LANES=${MONOLITH_LANES:-1}
      - CT2_CPU_THREADS=${MONOLITH_CT2_CPU_THREADS:-0}
      - HF_HUB_DISABLE_IMPLICIT_TOKEN=1
    volumes:
      - monolith_audio:/tmp/asr_audio
    mem_limit: 4g
    memswap_limit: 4g
    depends_on:
      monolith-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── REDIS (v2) ───────────────────────────────────────────────────────────────
  # Job queue (Redis Streams), job status store, and the token revocation
  # mirror the gateway reads in AUTH_MODE=local. Not a source of truth for
  # anything durable: transcriptions still live in trans-db. AOF on so queued
  # jobs survive a Redis restart (E6 scenario).
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

  # ── BASES DE DATOS ───────────────────────────────────────────────────────────
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
      POSTGRES_DB: user_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  audio-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audio_user
      POSTGRES_PASSWORD: audio_pass
      POSTGRES_DB: audio_db
    volumes:
      - audio_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio_user -d audio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  trans-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trans_user
      POSTGRES_PASSWORD: trans_pass
      POSTGRES_DB: trans_db
    volumes:
      - trans_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trans_user -d trans_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  monolith-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monolith_user
      POSTGRES_PASSWORD: monolith_pass
      POSTGRES_DB: monolith_db
    volumes:
      - monolith_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monolith_user -d monolith_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_db_data:
  user_db_data:
  audio_db_data:
  trans_db_data:
  asr_audio:
  monolith_db_data:
  monolith_audio:
  redis_data:
